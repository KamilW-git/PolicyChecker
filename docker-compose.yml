version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: policyuser
      POSTGRES_PASSWORD: policypassword
      POSTGRES_DB: policychecker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: node:20
    working_dir: /app/web
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://policyuser:policypassword@db:5432/policychecker?schema=public
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    shm_size: '2gb'
    command: npm run dev
    tty: true
    stdin_open: true
    depends_on:
      - db

volumes:
  pgdata:
