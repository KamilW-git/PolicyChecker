version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: policyuser
      POSTGRES_PASSWORD: policypassword
      POSTGRES_DB: policychecker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyuser -d policychecker"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  app:
    image: node:20
    working_dir: /app/web
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://policyuser:policypassword@db:5432/policychecker?schema=public
      - JWT_SECRET=w_produkcji_uzyj_mocnego_sekretu_losowego_stringa
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    shm_size: '2gb'
    command: >
      sh -c "
        set -e;
        npx prisma generate;
        i=0;
        until npx prisma migrate deploy; do
          i=$$((i+1));
          if [ $$i -ge 30 ]; then echo 'Baza niedostepna po 30 probach'; exit 1; fi;
          echo \"Czekam na baze... ($$i/30)\";
          sleep 2;
        done;
        npx tsx prisma/seed.ts;
        npm run dev
      "
    tty: true
    stdin_open: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
